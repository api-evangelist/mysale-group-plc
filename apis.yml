name: MYSALE GROUP PLC
description: 'MySale Group PLC is a former AIM-listed online retailer that operated flash-sale and
  outlet e-commerce marketplaces across Australia, New Zealand and Southeast Asia under brands including
  MySale, OzSale, BuyInvite and Cocosa. The group was delisted and its corporate operations wound down;
  the surviving consumer brand, OzSale (ozsale.com.au), now runs as a Shopify-hosted storefront. As of
  this enrichment pass the company exposes no public developer program, API, SDK, or webhook surface: the
  corporate domain mysalegroup.com no longer resolves and the remaining brand sites are consumer retail
  storefronts only. This record is retained as a portfolio-lead profile surfaced from the Insight Partners
  portfolio; it has no API artifacts to catalog.'
